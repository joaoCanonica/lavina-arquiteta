  - region "Sobre o projeto":
    - paragraph: "Projeto T|B é um projeto residencial em Campo Belo do Sul da Lavina — coletivo de arquitetura, de Lages (SC), liderado pela arquiteta Amanda Lavina. As imagens são 3D do projeto, não fotos de obra. Destaques: painel paramétrico em madeira, camisas expostas com iluminação integrada, tons sóbrios, madeira e tecidos. Projeto: Renata Nürnberg para Lavina — coletivo de arquitetura."
    - paragraph: Imagem 3D do projeto Todas as imagens desta página são imagens 3D do projeto. Nenhuma delas é foto de obra.
    - paragraph: "Um quarto que vai além do descanso: um refúgio particular."
    - paragraph: A proposta nasceu do desejo por um ambiente masculino, acolhedor e voltado ao lazer. O painel paramétrico em madeira percorre o espaço, e as camisas assinadas ganham uma área própria, com iluminação integrada.
    - heading "O pedido" [level=2]
    - paragraph: Um quarto masculino, acolhedor e voltado ao lazer, com lugar para as camisas assinadas do cliente.
    - heading "A resposta do projeto" [level=2]
    - paragraph: Painel paramétrico em madeira como elemento de destaque, área de exposição das camisas com luz integrada e tons sóbrios, madeira e tecidos para uma atmosfera intimista. Cada escolha foi pensada para que o ambiente carregasse a identidade e as paixões de quem vai vivê-lo. A obra já foi executada; as fotos dela ainda não estão no site.
    - heading "Detalhes" [level=2]
    - list:
      - listitem: Painel paramétrico em madeira
      - listitem: Camisas expostas com iluminação integrada
      - listitem: Tons sóbrios, madeira e tecidos
