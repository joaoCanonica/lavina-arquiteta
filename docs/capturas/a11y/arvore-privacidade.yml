  - region "1. Quem cuida dos dados":
    - heading "1. Quem cuida dos dados" [level=2]
    - paragraph:
      - text: A controladora dos dados tratados por este site é a
      - strong: Amanda Lavina Arquitetura Ltda
      - text: ", CNPJ 52.116.202/0001-05, que atua com o nome Lavina — coletivo de arquitetura. Endereço: Av. Pres. Vargas, 505, Sagrado Coração de Jesus, Lages/SC, CEP 88508-110."
  - region "2. Que dados são tratados":
    - heading "2. Que dados são tratados" [level=2]
    - list:
      - listitem:
        - strong: "Ao navegar:"
        - text: a hospedagem do site (Vercel) recebe dados técnicos de cada acesso, como endereço IP, data e hora, página pedida e tipo de navegador. Isso acontece em qualquer site e serve para entregar as páginas com segurança.
      - listitem:
        - strong: Sua escolha de privacidade
        - text: e, se você permitir, o tema escolhido, guardados no seu próprio navegador (veja a seção 5).
      - listitem:
        - strong: "Se você aceitar “Estatística”:"
        - text: contagem de visitas por página e de cliques no WhatsApp, de forma agregada.
      - listitem:
        - strong: "Se você aceitar “Mapas”:"
        - text: ao carregar o mapa, o Google recebe seu endereço IP e dados do navegador.
      - listitem:
        - strong: "Se você chamar no WhatsApp:"
        - text: o que você escrever na conversa, seu nome e seu número de telefone. A mensagem pronta do site só leva o tipo de projeto e a cidade que você escolher, e pode ser editada antes de enviar.
    - paragraph: O site não pede dados sensíveis, não tem cadastro, não faz perfil de comportamento e não é dirigido a crianças.
