  - region "6. Por quanto tempo":
    - heading "6. Por quanto tempo" [level=2]
    - list:
      - listitem:
        - strong: "Escolha de privacidade:"
        - text: 12 meses no seu navegador.
      - listitem:
        - strong: "Dados técnicos de acesso:"
        - text: pelo prazo da hospedagem e, quando a lei exigir, pelo prazo do Marco Civil da Internet (Lei 12.965/2014, art. 15).
      - listitem:
        - strong: "Conversas de orçamento:"
        - text: pelo tempo necessário para o atendimento e, se houver contrato, pelos prazos legais que se aplicam a ele.
  - region "7. Seus direitos":
    - heading "7. Seus direitos" [level=2]
    - paragraph: "Pela LGPD (art. 18), você pode pedir, a qualquer momento:"
    - list:
      - listitem: confirmação de que tratamos seus dados
      - listitem: acesso aos dados
      - listitem: correção de dados incompletos ou desatualizados
      - listitem: anonimização, bloqueio ou eliminação de dados desnecessários
      - listitem: portabilidade
      - listitem: eliminação dos dados tratados com consentimento
      - listitem: informação sobre com quem compartilhamos
      - listitem: informação sobre não consentir e o que isso implica
      - listitem: revogação do consentimento
    - paragraph: Se a sua questão não for resolvida conosco, você pode reclamar à Autoridade Nacional de Proteção de Dados (ANPD).
