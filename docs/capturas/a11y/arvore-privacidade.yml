  - region "4. Serviços de terceiros":
    - heading "4. Serviços de terceiros" [level=2]
    - list:
      - listitem:
        - strong: "WhatsApp (Meta):"
        - text: a conversa de orçamento acontece no WhatsApp, que tem a própria política de privacidade. O site só abre o link; nenhum script da Meta é carregado aqui.
      - listitem:
        - strong: "Instagram (Meta):"
        - text: o site tem apenas links para os perfis. Nenhuma publicação é incorporada e nenhum script da Meta é carregado.
      - listitem:
        - strong: "Google Maps:"
        - text: só carrega na página de contato, depois do seu consentimento para “Mapas”. Antes disso, há apenas um link que abre o mapa em outra aba.
      - listitem:
        - strong: "Vercel:"
        - text: hospeda o site e, com o seu consentimento para “Estatística”, faz a contagem de visitas e cliques.
    - paragraph: Esses serviços podem tratar dados fora do Brasil. Nesses casos, a transferência segue as regras da LGPD para transferência internacional (arts. 33 a 36).
