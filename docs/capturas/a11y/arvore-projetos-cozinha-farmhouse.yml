  - region "Sobre o projeto":
    - paragraph: "Cozinha farmhouse é um projeto residencial da Lavina — coletivo de arquitetura, de Lages (SC), liderado pela arquiteta Amanda Lavina. A obra executada aparece em vídeo e em quadros do vídeo. Destaques: marcenaria azul com luz no rodapé, cristaleiras em arco iluminadas, mesa redonda. Projeto: Lavina — coletivo de arquitetura."
    - paragraph: "Aqui a cliente não precisou se adaptar ao estilo do escritório: o projeto foi construído a partir da identidade dela."
    - paragraph: Nada de minimalismo. Marcenaria azul com luz no rodapé, cristaleiras em arco e mesa redonda, numa cozinha em que sofisticação e personalidade caminham juntas.
    - heading "O pedido" [level=2]
    - paragraph: Uma cozinha com a cara da cliente, e não com a do escritório.
    - heading "A resposta do projeto" [level=2]
    - paragraph: "Marcenaria azul com fita de luz no rodapé, cristaleiras em arco com iluminação, mesa redonda e um bar em arco ao lado do estar. A cliente comentou: \"O projeto ficou exatamente do jeitinho que eu sonhava e imaginava.\""
    - heading "Detalhes" [level=2]
    - list:
      - listitem: Marcenaria azul com luz no rodapé
      - listitem: Cristaleiras em arco iluminadas
      - listitem: Mesa redonda
      - listitem: Bar em arco
