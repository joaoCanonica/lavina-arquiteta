  - region "Sobre o projeto":
    - paragraph: "Banheiro em tons claros é um projeto residencial da Lavina — coletivo de arquitetura, de Lages (SC), liderado pela arquiteta Amanda Lavina. As fotos são da obra executada. Destaques: espelho com luz embutida, cuba esculpida, marcenaria com puxadores dourados. Projeto: Lavina — coletivo de arquitetura."
    - paragraph: "Neste banheiro, os tons claros não foram só uma escolha estética: foram estratégicos."
    - paragraph: A paleta neutra e o porcelanato suave refletem luz, ampliam a percepção do espaço e criam uma atmosfera de sofisticação serena. Um espaço compacto pode e deve parecer grandioso.
    - heading "O pedido" [level=2]
    - paragraph: Um banheiro compacto que parecesse maior.
    - heading "A resposta do projeto" [level=2]
    - paragraph: Paleta neutra e porcelanato suave para refletir a luz; espelho com luz embutida sobre a bancada; marcenaria com puxadores dourados; cuba esculpida; banheira.
