  - region "Sobre o projeto":
    - paragraph: "Clínica Cordis é um projeto de saúde em Lages da Lavina — coletivo de arquitetura, de Lages (SC), liderado pela arquiteta Amanda Lavina. As imagens são 3D do projeto, não fotos de obra. Destaques: coração iluminado integrado ao painel, bancada de pedra escura, recepção com curvas e luz. Projeto: Renata Nürnberg para Lavina — coletivo de arquitetura."
    - paragraph: Imagem 3D do projeto Todas as imagens desta página são imagens 3D do projeto. Nenhuma delas é foto de obra.
    - paragraph: Consultório de cardiologia desenvolvido a partir da integração entre funcionalidade, conforto e identidade visual.
    - paragraph: A marcenaria organiza o armazenamento e o apoio ao atendimento, e um coração iluminado, integrado ao painel, reforça a especialidade de forma sutil e autoral, como mostram as imagens 3D do projeto.
    - heading "O pedido" [level=2]
    - paragraph: Um consultório que unisse funcionalidade, conforto e a identidade visual da Cordis Cardiologia, e que recebesse com cuidado desde o primeiro contato.
    - heading "A resposta do projeto" [level=2]
    - paragraph: "Bancada de trabalho para uma rotina mais prática e fluida, marcenaria que organiza o atendimento e o coração iluminado no painel. Na recepção, curvas, detalhes iluminados e a mesma proposta em duas versões: off-white, para leveza e continuidade, e madeira, para profundidade e acolhimento. A obra já foi executada; as fotos dela ainda não estão no site."
    - heading "Detalhes" [level=2]
    - list:
      - listitem: Coração iluminado integrado ao painel
      - listitem: Bancada de pedra escura
      - listitem: Recepção com curvas e luz
