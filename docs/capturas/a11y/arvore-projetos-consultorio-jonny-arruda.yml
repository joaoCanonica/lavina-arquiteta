  - region "Sobre o projeto":
    - paragraph: "Consultório Jonny Arruda é um projeto de saúde em Lages da Lavina — coletivo de arquitetura, de Lages (SC), liderado pela arquiteta Amanda Lavina. Mostra a imagem 3D do projeto, o antes, a obra executada. Destaques: estantes com luz embutida, mesa oval de pedra. Projeto: Lavina — coletivo de arquitetura; imagens 3D: Renata Nürnberg."
    - paragraph: Um consultório de ginecologia e obstetrícia de alto risco em que cada detalhe foi desenhado para gerar conforto, confiança e tranquilidade.
    - paragraph: "Um espaço técnico, mas profundamente humano. Aqui o projeto pode ser visto duas vezes: na imagem 3D, antes da obra, e na obra executada, no mesmo ângulo."
    - heading "O pedido" [level=2]
    - paragraph: Um ambiente que transformasse consultas em momentos de cuidado e transmitisse tranquilidade, segurança e delicadeza desde o primeiro olhar.
    - heading "A resposta do projeto" [level=2]
    - paragraph: Marcenaria em madeira com armário curvo, estantes com luz embutida e uma mesa oval de pedra no lugar do escritório antigo. A sala de exame ganhou painel de madeira, iluminação indireta e cortina. Pelo comentário da Renata, o resultado ficou fiel ao projeto.
    - heading "Detalhes" [level=2]
    - list:
      - listitem: Estantes com luz embutida
      - listitem: Mesa oval de pedra
      - listitem: Painel de madeira na sala de exame
