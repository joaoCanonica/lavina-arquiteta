  - region "Sobre o projeto":
    - paragraph: "Quarto e closet é um projeto residencial da Lavina — coletivo de arquitetura, de Lages (SC), liderado pela arquiteta Amanda Lavina. A obra executada aparece em vídeo e em quadros do vídeo. Destaques: arandelas na cabeceira, penteadeira com espelho iluminado, closet integrado. Projeto: Lavina — coletivo de arquitetura."
    - paragraph: Às vezes o que você precisa não é de uma casa nova, mas de um novo olhar para a sua casa.
    - paragraph: "Este quarto passou por uma transformação: cada centímetro foi redesenhado para trazer amplitude, leveza e sofisticação, com closet e penteadeira integrados."
    - heading "O pedido" [level=2]
    - paragraph: Um quarto que voltasse a representar quem vive nele.
    - heading "A resposta do projeto" [level=2]
    - paragraph: "Cada centímetro redesenhado: cabeceira estofada com arandelas, penteadeira com espelho iluminado, nichos e um closet de portas claras."
    - heading "Detalhes" [level=2]
    - list:
      - listitem: Arandelas na cabeceira
      - listitem: Penteadeira com espelho iluminado
      - listitem: Closet integrado
