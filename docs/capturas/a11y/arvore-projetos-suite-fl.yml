  - region "Sobre o projeto":
    - paragraph: "Suíte F|L é um projeto residencial em Lages da Lavina — coletivo de arquitetura, de Lages (SC), liderado pela arquiteta Amanda Lavina. As imagens são 3D do projeto, não fotos de obra. Destaques: cama com arandelas, roupeiro, painel de TV. Projeto: Renata Nürnberg para Lavina — coletivo de arquitetura."
    - paragraph: Imagem 3D do projeto Todas as imagens desta página são imagens 3D do projeto. Nenhuma delas é foto de obra.
    - paragraph: Neste projeto, o principal pedido dos clientes era tons escuros.
    - paragraph: A missão foi fazer essa escolha conversar com a luz, com as texturas e com cada detalhe do ambiente, para que a suíte transmitisse conforto e aconchego. As imagens 3D mostram a cama com arandelas, o roupeiro e o painel de TV.
    - heading "O pedido" [level=2]
    - paragraph: Uma suíte em tons escuros.
    - heading "A resposta do projeto" [level=2]
    - paragraph: "Fazer o escuro conversar com a luz, com as texturas e com cada detalhe: arandelas na cabeceira, roupeiro e painel de TV no mesmo tom."
