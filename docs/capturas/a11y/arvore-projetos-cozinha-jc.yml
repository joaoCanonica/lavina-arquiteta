  - region "Sobre o projeto":
    - paragraph: "Cozinha J|C é um projeto residencial em Balneário Camboriú da Lavina — coletivo de arquitetura, de Lages (SC), liderado pela arquiteta Amanda Lavina. Mostra a imagem 3D do projeto, o antes, a obra executada e o vídeo da entrega. Destaques: linha de luz embutida no forro. Projeto: Lavina — coletivo de arquitetura; imagens 3D: Renata Nürnberg."
    - paragraph: "A cozinha existente foi inteira repensada, e o caminho pode ser visto de ponta a ponta: a imagem 3D do projeto, o antes, a obra executada e o vídeo da entrega."
    - paragraph: "Leveza na composição, riqueza nos detalhes: a textura da pedra, a suavidade da iluminação e o equilíbrio entre cada elemento."
    - heading "O pedido" [level=2]
    - paragraph: Transformar a cozinha antiga (armários e bancada de granito, piso cerâmico) num ambiente de conforto e sofisticação sutil e atemporal.
    - heading "A resposta do projeto" [level=2]
    - paragraph: "Marcenaria clara do piso ao teto, torre de fornos, ilha de pedra com banquetas, cristaleira iluminada e uma linha de luz embutida no forro. A obra seguiu o projeto: \"Se você acompanhou os nossos últimos posts, já pode perceber o quanto o projeto ficou fiel a execução!\""
    - heading "Detalhes" [level=2]
    - list:
      - listitem: Linha de luz embutida no forro
      - listitem: Torre de fornos e refrigerador embutidos
      - listitem: Ilha de pedra e cristaleira iluminada
