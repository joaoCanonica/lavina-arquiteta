  - region "Sobre o projeto":
    - paragraph: "Living e jantar com painel paramétrico é um projeto residencial da Lavina — coletivo de arquitetura, de Lages (SC), liderado pela arquiteta Amanda Lavina. A obra executada aparece em vídeo e em quadros do vídeo. Destaques: painel paramétrico em madeira, forro de madeira com sanca iluminada, cristaleira com luz embutida. Projeto: Lavina — coletivo de arquitetura."
    - paragraph: "Um living com jantar em que o painel da TV deixou de ser só um painel: a marcenaria paramétrica em madeira percorre a parede e conversa com o forro de madeira, a sanca iluminada, a mesa redonda e a cristaleira com luz."
    - paragraph: A Amanda apresenta o ambiente em vídeo.
    - heading "O pedido" [level=2]
    - paragraph: Um projeto que reflita quem vai viver ali, e não apenas uma assinatura estética.
    - heading "A resposta do projeto" [level=2]
    - paragraph: "\"Não precisa ser só um simples painel de tv! Neste projeto trouxemos um design inovador, que se tornou uma obra de arte.\" Em volta dele: mesa redonda de madeira, cristaleira iluminada, bancada de café e forro de madeira com luz indireta (quadros do vídeo)."
    - heading "Detalhes" [level=2]
    - list:
      - listitem: Painel paramétrico em madeira
      - listitem: Forro de madeira com sanca iluminada
      - listitem: Cristaleira com luz embutida
      - listitem: Mesa redonda de jantar
