- main:
  - region "Presença em cada etapa.":
    - paragraph: Processo
    - heading "Presença em cada etapa." [level=1]
    - paragraph: Arquitetura é feita de detalhes e processos bem definidos. No nosso escritório, cada projeto passa por cinco etapas.
    - paragraph: "A Lavina — coletivo de arquitetura, de Lages (SC), liderado pela arquiteta Amanda Lavina, conduz cada projeto de interiores em cinco etapas: reunião inicial, estudo do espaço e da rotina, criação do conceito, projeto técnico e acompanhamento próximo da obra, em Lages e no Litoral Catarinense, para que a execução seja fiel ao projeto."
  - region "As cinco etapas":
    - heading "As cinco etapas" [level=2]
    - list:
      - listitem:
        - 'heading "Etapa 1: Reunião inicial, para entender cada necessidade." [level=3]'
        - paragraph: “Antes de falar de plantas, medidas e orçamentos… a gente fala sobre você.”
      - listitem:
        - 'heading "Etapa 2: Estudo do espaço, da rotina e do estilo de vida de quem vai viver ali." [level=3]'
        - paragraph: Seu lifestyle, o que te encanta, o que você não gosta, suas memórias e sonhos.
      - listitem:
        - 'heading "Etapa 3: Criação do conceito, onde estética e propósito se encontram." [level=3]'
        - paragraph: “É como assistir a um filme na mente e depois desenhá-lo cena por cena.”
      - listitem:
        - 'heading "Etapa 4: Desenvolvimento do projeto técnico, com soluções funcionais e criativas." [level=3]'
        - paragraph: “Cada escolha tem um motivo. Cada detalhe tem uma função.”
      - listitem:
        - 'heading "Etapa 5: Acompanhamento próximo da execução, para que tudo saia como planejado." [level=3]'
        - paragraph: “Não existe acaso em um projeto bem executado.”
    - paragraph: A inteligência artificial também entra, de forma sutil, na organização do processo.
  - region "Um dia no escritório.":
    - paragraph: Vídeo
    - heading "Um dia no escritório." [level=2]
    - figure "Vídeo A rotina é cheia de reuniões, obras e detalhes. Por trás de tudo isso, existe gente que gosta de ver projetos virando lares.":
