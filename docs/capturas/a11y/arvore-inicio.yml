  - region "Presença em cada etapa":
    - paragraph: Processo
    - heading "Presença em cada etapa" [level=2]
    - paragraph: Arquitetura é feita de detalhes e processos bem definidos. No nosso escritório, cada projeto passa por cinco etapas.
    - figure "Vídeo A rotina é cheia de reuniões, obras e detalhes. Por trás de tudo isso, existe gente que gosta de ver projetos virando lares.":
      - 'button "Tocar o vídeo: Um dia no escritório Lavina (com som)"'
      - text: Vídeo A rotina é cheia de reuniões, obras e detalhes. Por trás de tudo isso, existe gente que gosta de ver projetos virando lares.
    - list:
      - listitem:
        - heading "Reunião inicial, para entender cada necessidade." [level=3]
        - paragraph: “Antes de falar de plantas, medidas e orçamentos… a gente fala sobre você.”
        - text: 8 AM
        - 'button "Etapa 01: ver no vídeo, a partir de 8 AM"'
      - listitem:
        - heading "Estudo do espaço, da rotina e do estilo de vida de quem vai viver ali." [level=3]
        - paragraph: Seu lifestyle, o que te encanta, o que você não gosta, suas memórias e sonhos.
        - text: 9 AM
        - 'button "Etapa 02: ver no vídeo, a partir de 9 AM"'
      - listitem:
        - heading "Criação do conceito, onde estética e propósito se encontram." [level=3]
        - paragraph: “É como assistir a um filme na mente e depois desenhá-lo cena por cena.”
        - text: 10 AM
        - 'button "Etapa 03: ver no vídeo, a partir de 10 AM"'
      - listitem:
        - heading "Desenvolvimento do projeto técnico, com soluções funcionais e criativas." [level=3]
        - paragraph: “Cada escolha tem um motivo. Cada detalhe tem uma função.”
        - text: 2 PM
        - 'button "Etapa 04: ver no vídeo, a partir de 2 PM"'
      - listitem:
        - heading "Acompanhamento próximo da execução, para que tudo saia como planejado." [level=3]
        - paragraph: “Não existe acaso em um projeto bem executado.”
        - text: Entrega
        - 'button "Etapa 05: ver no vídeo, a partir de Entrega"'
    - paragraph: A inteligência artificial também entra, de forma sutil, na organização do processo.
